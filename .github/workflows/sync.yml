name: Sync AdTidy Filters

on:
  schedule:
    - cron: '27 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download filters
        run: node scripts/sync.js

      - name: Update ping
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e "
            const fs = require('fs');
            const p = fs.existsSync('public/ping.json') ? JSON.parse(fs.readFileSync('public/ping.json', 'utf8')) : {};
            const now = '$NOW';
            const lastUpdated = p.updatedAt ? new Date(p.updatedAt) : null;
            if (!lastUpdated || (Date.now() - lastUpdated.getTime()) >= 12 * 60 * 60 * 1000) {
              p.updatedAt = now;
              p.nextUpdate = new Date(Date.now() + 12 * 60 * 60 * 1000).toISOString().replace(/\\.\\d+Z$/, 'Z');
            }
            p.ok = true;
            p.jobRanAt = now;
            const d = new Date(now);
            const nextHour = [0,6,12,18].find(h => h > d.getUTCHours()) ?? 24;
            const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + (nextHour === 24 ? 1 : 0), nextHour % 24, 27));
            p.jobNextRunAt = next.toISOString().replace(/\.\d+Z$/, 'Z');
            fs.writeFileSync('public/ping.json', JSON.stringify(p));
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync adtidy filters" && git push)

      - name: Purge jsDelivr
        run: node scripts/purge-cache.js
  
      - name: Mirror to GitLab
        env:
          GITLAB_COMMIT: ${{ secrets.GITLAB_COMMIT }}
        run: |
          git clone "https://oauth2:${GITLAB_COMMIT}@gitlab.com/${{ github.repository_owner }}/adtidy-filter-mirror.git" /tmp/adtidy-filter-mirror
          cp public/ping.json /tmp/adtidy-filter-mirror/public/ping.json
          cp public/extension/chromium/filters.json /tmp/adtidy-filter-mirror/public/extension/chromium/filters.json
          cp public/extension/chromium/filters/*.txt /tmp/adtidy-filter-mirror/public/extension/chromium/filters/
          cd /tmp/adtidy-filter-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync filters" && git push)

      - name: Warm jsDelivr cache
        run: node scripts/warm-cache.js

      - name: Commit cache report
        run: |
          git add public/jsdelivr-cache-report.json
          git diff --cached --quiet || (git commit -m "chore: update jsdelivr cache report" && git push)

