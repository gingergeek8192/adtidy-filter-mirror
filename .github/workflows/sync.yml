name: Sync AdTidy Filters

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download filters
        run: node scripts/sync.js

      - name: Update ping
        run: printf '{"ok":true,"updatedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/ping.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync adtidy filters" && git pull --rebase && git push)

      - name: Warm jsDelivr cache
        run: node scripts/warm-cache.js

      - name: Commit cache report
        run: |
          git add public/jsdelivr-cache-report.json
          git diff --cached --quiet || (git commit -m "chore: update jsdelivr cache report" && git pull --rebase && git push)

      - name: Mirror to GitLab
        run: |
          git clone https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/gingergeek8192/redundancy-layers.git /tmp/redundancy-layers
          cp public/ping.json /tmp/redundancy-layers/public/ping.json
          cp public/extension/chromium/filters.json /tmp/redundancy-layers/public/extension/chromium/filters.json
          cp public/extension/chromium/filters/*.txt /tmp/redundancy-layers/public/extension/chromium/filters/
          cd /tmp/redundancy-layers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync filters" && git push)
