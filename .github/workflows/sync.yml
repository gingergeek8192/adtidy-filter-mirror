name: Sync AdTidy Filters

on:
  schedule:
    - cron: '27 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download filters
        run: node scripts/sync.js

      - name: Update ping
        run: printf '{"ok":true,"updatedAt":"%s","nextUpdate":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(date -u -d '+13 hours' +%Y-%m-%dT%H:%M:%SZ)" > public/ping.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync adtidy filters" && git push)

      - name: Purge jsDelivr
        run: node scripts/purge-cache.js
  
      - name: Mirror to GitLab
        env:
          GITLAB_COMMIT: ${{ secrets.GITLAB_COMMIT }}
        run: |
          git clone "https://oauth2:${GITLAB_COMMIT}@gitlab.com/${{ github.repository_owner }}/adtidy-filter-mirror.git" /tmp/adtidy-filter-mirror
          cp public/ping.json /tmp/adtidy-filter-mirror/public/ping.json
          cp public/extension/chromium/filters.json /tmp/adtidy-filter-mirror/public/extension/chromium/filters.json
          cp public/extension/chromium/filters/*.txt /tmp/adtidy-filter-mirror/public/extension/chromium/filters/
          cd /tmp/adtidy-filter-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || (git commit -m "chore: sync filters" && git push)

      - name: Warm jsDelivr cache
        run: node scripts/warm-cache.js

      - name: Commit cache report
        run: |
          git add public/jsdelivr-cache-report.json
          git diff --cached --quiet || (git commit -m "chore: update jsdelivr cache report" && git push)

